name: CI & Safety Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r block12/requirements.txt
          pip install pytest

      - name: Bootstrap Offline Fixtures & FAISS Index
        run: |
          cd block12
          python scripts/bootstrap.py

      - name: Run Hermetic Regression & Unit Tests
        run: |
          cd block12
          python -m unittest tests.test_sentinel

      - name: Run Safety & Failure Mode Edge-Case Tests (Pytest)
        run: |
          cd block12
          python -m pytest tests/test_safety_and_edge_cases.py -v

