name: CI & Safety Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: "mock_ci_groq_api_key_placeholder"
      SENTINEL_OFFLINE_EVAL: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r block12/requirements.txt
          pip install pytest pytest-cov

      - name: Bootstrap Offline Fixtures & FAISS Index
        run: |
          cd block12
          python scripts/bootstrap.py

      - name: Verify Automated Threshold Calibration (FNR <= 35%)
        run: |
          cd block12
          python scripts/calibrate_threshold.py 0.35

      - name: Run Hermetic Regression & Safety Test Suite with Coverage
        run: |
          cd block12
          python -m pytest tests/ --cov=src --cov-report=term-missing

